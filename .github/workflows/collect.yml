name: collect

on:
  schedule:
    - name: 每日 18:00 (UTC+8 凌晨 2 点)
      cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 采集长历史
        run: node _scripts/collect-history.mjs

      - name: 重新编译内容
        run: node _scripts/build-content.mjs

      - name: 提交变更
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "没有变化，跳过提交"
            exit 0
          fi
          git commit -m "data: refresh 长历史序列与内容产物 [skip ci]"
          git push
