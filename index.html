/* 启动期错误可见化：把异常写进标题与页脚，方便定位（不吞错误，只让它可见） */
window.__ofaErrors = [];
function __ofaReport(kind, msg) {
  window.__ofaErrors.push(kind + ': ' + msg);
  try {
    // 标题只带调试标记时改，避免污染正常浏览时的标题
    if (/(\?|&)debug=1/.test(location.search)) {
      document.title = 'JS-' + kind + ': ' + String(msg).slice(0, 120);
    }
    var b = document.getElementById('boot-error');
    if (!b) {
      b = document.createElement('pre');
      b.id = 'boot-error';
      b.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:9999;max-height:40vh;overflow:auto;'
        + 'margin:0;padding:12px 16px;background:#3b1518;color:#ffd9d4;font:12px/1.6 monospace;white-space:pre-wrap;border-top:2px solid #b06367';
      (document.body || document.documentElement).appendChild(b);
    }
    b.textContent = window.__ofaErrors.join('\n');
  } catch (e) { /* 报告本身失败就算了 */ }
}
window.addEventListener('error', function (e) {
  __ofaReport('ERR', (e.message || 'unknown') + ' @ ' + String(e.filename || '').split('/').pop() + ':' + e.lineno);
});
window.addEventListener('unhandledrejection', function (e) {
  var r = e.reason;
  __ofaReport('REJ', (r && (r.stack || r.message)) || String(r));
});
</script>
